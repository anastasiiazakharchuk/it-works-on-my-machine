apiVersion: v1
kind: Service
metadata:
  name: {{ include "it-works-on-my-machine-app.frontend.fullname" . }}
spec:
  {{- with .Values.frontend.service }}
  type: {{ .type }}
  selector:
    {{- include "it-works-on-my-machine-app.frontend.selectorLabels" $ | nindent 4 }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      {{- if and (eq .type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  {{- end }}
