apiVersion: v1
kind: Pod
metadata:
  name: "backend-test-connection"
  labels:
    {{- include "it-works-on-my-machine-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: [ 'wget' ]
      args: [ '{{ include "it-works-on-my-machine-app.backend.fullname" . }}:{{ .Values.backend.service.port }}' ]
  restartPolicy: Never
